<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Cientifica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
<body class="bg-black text-light d-flex justify-content-center align-items-center min-vh-100 p-3">
  <div class="card bg-dark text-light border-secondary shadow-lg col-12 col-sm-9 col-md-6 col-lg-4">
    <!---Encabezado-->
    <div class="card-header border-secondary d-flex justify-content-between align-items-center py-2"><span class="badge bg-info text-dark fw-bold">BTH 5TO DE SECUNDARIA</span>
        <h1 class="h6 text-uppercase fw-bold text-secondary mb-0">CALCULADORA CIENTIFICA</h1>
    </div>
    <!--CUERPO-->
    <div class="card-body p-3">
        <div class="bg-black border border-secondary rounded p-2 mb-2">
        <p id="historial" class="text-end text-secondary small font-monospace mb-1">&nbsp;</p>
        <input type="text" id="pantalla" 
        
        class="form-control form-control-lg bg-black text-end text-success fw-bold fs-2 border-0 font-monospace p-0 shadow-none"
        value="0" readonly/>

        </div>
      <!-- Fila 1:funciones trigonometricas y Raiz-->
      <div class="row g-2 mb-2">
        <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calcularCientifica('sin')">sin</button></div>
          <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calcularCientifica('cos')">cos</button></div>
          <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calcularCientifica('tan')">tan</button></div>
          <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calcularCientifica('sqrt')">√</button></div>
      </div>
      <!-- Fila 2:Potencia,logaritmo, Pi y cambio de signo-->
      <div class="row g-2 mb-2">
        <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calcularCientifica('pow2')">x²</button></div>
        <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calcularCientifica('log')">log</button></div>
        <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="insertarPi('')">π</button></div>
        <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calcularCientifica('signo')">±</button></div>
      </div>
      <!-- Fila 3 -->
      <div class="row g-2 mb-2">
        <div class="col-3"><button class="btn btn-danger w-100 fw-bold py-2" onclick="limpiarPantalla()">C</button></div>
        <div class="col-3"><button class="btn btn-danger w-100 fw-bold py-2" onclick="borrarUltimo()">⌫</button></div>
        <div class="col-3"><button class="btn btn-warning w-100 fw-bold py-2" onclick="agregarValor('%')">%</button></div>
        <div class="col-3"><button class="btn btn-warning w-100 fw-bold py-2" onclick="agregarValor('÷')">÷</button></div>
      </div>
      <!-- Fila 4 -->
      <div class="row g-2 mb-2">
        <div class="col-3"><button class="btn btn-secondary w-100 fw-bold py-2" onclick="agregarValor('7')">7</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100 fw-bold py-2" onclick="agregarValor('8')">8</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100 fw-bold py-2" onclick="agregarValor('9')">9</button></div>
        <div class="col-3"><button class="btn btn-warning w-100 fw-bold py-2" onclick="agregarValor('×')">×</button></div>
      </div>
      <!-- Fila 5 -->
      <div class="row g-2 mb-2">
        <div class="col-3"><button class="btn btn-secondary w-100 fw-bold py-2" onclick="agregarValor('4')">4</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100 fw-bold py-2" onclick="agregarValor('5')">5</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100 fw-bold py-2" onclick="agregarValor('6')">6</button></div>
        <div class="col-3"><button class="btn btn-warning w-100 fw-bold py-2" onclick="agregarValor('−')">−</button></div>
      </div>
      <!-- Fila 6 -->
      <div class="row g-2 mb-2">
        <div class="col-3"><button class="btn btn-secondary w-100 fw-bold py-2" onclick="agregarValor('1')">1</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100 fw-bold py-2" onclick="agregarValor('2')">2</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100 fw-bold py-2" onclick="agregarValor('3')">3</button></div>
        <div class="col-3"><button class="btn btn-warning w-100 fw-bold py-2" onclick="agregarValor('+')">+</button></div>
      </div>
      <!-- Fila 7 -->
      <div class="row g-2 mb-2">
        <div class="col-3"><button class="btn btn-secondary w-100 fw-bold py-2" onclick="agregarValor('00')">00</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100 fw-bold py-2" onclick="agregarValor('0')">0</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100 fw-bold py-2" onclick="agregarValor('.')">.</button></div>
        <div class="col-3"><button class="btn btn-success w-100 fw-bold py-2" onclick="calcularResultado()">=</button></div>
      </div>
    </div>
  </div>
    <script src="script.js"></script>
</body>
</html>
